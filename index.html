<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>監控畫面 - 純 iframe 滿版版</title>
  <style>
    /* 徹底消滅所有捲軸、邊框、留白 */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      /* 關鍵：讓 iframe 內容自己縮放填滿 */
      transform-origin: 0 0;
      /* 以下這行會自動計算縮放比例，保證畫面完整顯示又不留白 */
      transform: scale(1);           /* 會被 JS 動態覆蓋 */
      image-rendering: pixelated;    /* 讓放大時畫質稍微好一點 */
    }
  </style>
</head>
<body>
  <!-- 直接把你原本就能看的頁面塞進來（http 或 https 都可以） -->
  <iframe id="stream" src="http://60.251.39.37:8088/videostreams/1/stream" allowfullscreen></iframe>

  <script>
    // 讓 iframe 內容自動縮放填滿視窗（不管原本是 640x480、1280x720 都完美撐滿）
    function resizeIframe() {
      const iframe = document.getElementById('stream');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      
      // 等 iframe 內頁面真的載入完才計算（很重要）
      if (iframeDoc && iframeDoc.body) {
        const w = iframeDoc.body.scrollWidth;
        const h = iframeDoc.body.scrollHeight;
        
        if (w && h) {
          const scaleX = window.innerWidth / w;
          const scaleY = window.innerHeight / h;
          const scale = Math.min(scaleX, scaleY);   // 取較小值 → 保證整張畫面都看得到
          
          iframe.style.transform = `scale(${scale})`;
          iframe.style.width = w + 'px';
          iframe.style.height = h + 'px';
        }
      }
    }

    // 載入完成 + 視窗變動時都重新計算
    window.addEventListener('load', () => {
      const iframe = document.getElementById('stream');
      iframe.addEventListener('load', resizeIframe);
      window.addEventListener('resize', resizeIframe);
      
      // 第一次強制跑一次（有些瀏覽器 load 事件會漏）
      setTimeout(resizeIframe, 1500);
      setTimeout(resizeIframe, 5000);   // 保險再跑一次
    });
  </script>
</body>
</html>
