<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>監控畫面 - 純 iframe 滿版版</title>
  <style>
    /* 徹底消滅所有捲軸、邊框、留白 */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      /* 關鍵：讓 iframe 內容自己縮放填滿 */
      transform-origin: 0 0;
      /* 以下這行會自動計算縮放比例，保證畫面完整顯示又不留白 */
      transform: scale(1);           /* 會被 JS 動態覆蓋 */
      image-rendering: pixelated;    /* 讓放大時畫質稍微好一點 */
    }
  </style>
</head>
<body>
  <!-- 直接把你原本就能看的頁面塞進來（http 或 https 都可以） -->
<iframe id="stream" 
        src="https://60.251.39.37:8088/videostreams/1/stream" 
        allowfullscreen
        data-intrinsic-width="1920" 
        data-intrinsic-height="1080"
></iframe>
  <script>
   // 讓 iframe 內容自動縮放填滿視窗（不管原本是 640x480、1280x720 都完美撐滿）
function resizeIframe() {
  const iframe = document.getElementById('stream');
  const w = parseInt(iframe.getAttribute('data-intrinsic-width'), 10);
  const h = parseInt(iframe.getAttribute('data-intrinsic-height'), 10);
  
  // 設定一個極微小的安全邊界 (例如 2px)
  const buffer = 2; 

  if (w && h && !isNaN(w) && !isNaN(h)) {
    
    // 1. 將 iframe 自身尺寸設定為內容的原始尺寸
    iframe.style.width = w + 'px';
    iframe.style.height = h + 'px';

    // 2. 計算縮放比例時，使用安全邊界
    // 確保縮放後的尺寸比實際視窗尺寸 (減去 buffer) 略小
    const scaleX = (window.innerWidth - buffer) / w; 
    const scaleY = (window.innerHeight - buffer) / h;
    const scale = Math.min(scaleX, scaleY); // 取較小值 (Contain 效果)

    // 3. 應用縮放
    iframe.style.transform = `scale(${scale})`;
    
    // 4. 居中畫面計算
    // 使用實際視窗寬度，減去縮放後的實際寬度/高度，然後除以 2
    const offsetX = (window.innerWidth - (w * scale)) / 2;
    const offsetY = (window.innerHeight - (h * scale)) / 2;
    
    iframe.style.top = `${offsetY}px`;
    iframe.style.left = `${offsetX}px`;

  } else {
    // 確保未設定尺寸時有基本 fallback
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.transform = 'scale(1)';
  }
}

// 保持原本的監聽事件...
window.addEventListener('load', () => {
  const iframe = document.getElementById('stream');
  // 由於我們無法存取 contentDocument，無法確認內頁是否真正載入完成。
  // 可以保留這個 load 監聽，但在跨域情境下，它主要作用是確保 iframe DOM 元素存在。
  iframe.addEventListener('load', resizeIframe);
  window.addEventListener('resize', resizeIframe);
  
  // 第一次強制跑一次 + 保險再跑一次
  resizeIframe(); // 第一次直接跑
  setTimeout(resizeIframe, 1500); 
  setTimeout(resizeIframe, 5000); 
});
  </script>
</body>
</html>
